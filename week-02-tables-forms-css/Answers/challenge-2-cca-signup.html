<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCA Sign-up</title>
</head>
<body>
  <main class="card">
    <h1>CCA Sign-up</h1>

    <form action="/submit" method="get">
      <p>
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname">
      </p>

      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </p>

      <p>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="13" max="22">
      </p>

      <p>
        <label for="cca">Preferred CCA</label>
        <select id="cca" name="cca">
          <option value="">-- choose --</option>
          <option value="robotics">Robotics Club</option>
          <option value="basketball">Basketball</option>
          <option value="orchestra">Chinese Orchestra</option>
          <option value="debate">Debate Society</option>
          <option value="photography">Photography Club</option>
          <option value="badminton">Badminton</option>
          <option value="drama">Drama Club</option>
        </select>
      </p>

      <fieldset>
        <legend>Do you have prior experience?</legend>
        <label><input type="radio" name="experience" value="yes"> Yes</label>
        <label><input type="radio" name="experience" value="no"> No</label>
      </fieldset>

      <fieldset>
        <legend>Days available</legend>
        <label><input type="checkbox" name="day" value="mon"> Mon</label>
        <label><input type="checkbox" name="day" value="tue"> Tue</label>
        <label><input type="checkbox" name="day" value="wed"> Wed</label>
        <label><input type="checkbox" name="day" value="thu"> Thu</label>
        <label><input type="checkbox" name="day" value="fri"> Fri</label>
      </fieldset>

      <p>
        <label for="why">Why do you want to join?</label>
        <textarea id="why" name="why" rows="4"></textarea>
      </p>

      <p>
        <button type="submit">Sign up</button>
      </p>
    </form>
  </main>
</body>
</html>
