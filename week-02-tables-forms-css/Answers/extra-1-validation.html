<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCA Sign-up (with validation)</title>
  <link rel="stylesheet" href="challenge-3-cca-signup.css">
</head>
<body>
  <main class="card">
    <h1>CCA Sign-up</h1>

    <form action="/submit" method="get">
      <p>
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname"
               required minlength="2" maxlength="50" autocomplete="name">
      </p>

      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </p>

      <p>
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" name="phone"
               pattern="[89][0-9]{7}" inputmode="numeric"
               title="8 digits, starting with 8 or 9 (for example 91234567)"
               autocomplete="tel">
      </p>

      <p>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="13" max="22" required>
      </p>

      <p>
        <label for="cca">Preferred CCA</label>
        <select id="cca" name="cca" required>
          <option value="">-- choose --</option>
          <option value="robotics">Robotics Club</option>
          <option value="basketball">Basketball</option>
          <option value="debate">Debate Society</option>
        </select>
      </p>

      <p><button type="submit">Sign up</button></p>
    </form>
  </main>
</body>
</html>
