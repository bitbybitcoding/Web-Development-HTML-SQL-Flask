<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CCA Showcase{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('ccas') }}">All CCAs</a>
    {% for cat in categories %}
    <a href="{{ url_for('category', name=cat) }}">{{ cat }}</a>
    {% endfor %}
    <a href="{{ url_for('about') }}">About</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>CCA Showcase · built with Flask</footer>
</body>
</html>
