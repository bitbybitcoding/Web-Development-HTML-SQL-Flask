{% extends "base.html" %}
{% block title %}{{ heading }} · Class Results{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<table>
  <tr><th>Name</th><th>Class</th><th>Average</th></tr>
  {% for s in students %}
  <tr class="{{ 'good' if average(s) >= 70 }}">
    <td><a href="{{ url_for('student', student_id=s.id) }}">{{ s.name }}</a></td>
    <td>{{ s['class'] }}</td>
    <td>{{ average(s) }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
