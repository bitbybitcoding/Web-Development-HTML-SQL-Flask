{% extends "base.html" %}
{% block content %}
<h1>Library</h1>
<form method="get" action="{{ url_for('index') }}">
  <label for="q">Title or author</label>
  <input type="search" id="q" name="q" value="{{ q }}">
  <label for="status">Show</label>
  <select id="status" name="status">
    {% for value, label in [('', 'All books'), ('available', 'Available'), ('on loan', 'On loan'), ('overdue', 'Overdue')] %}
    <option value="{{ value }}" {{ 'selected' if value == status }}>{{ label }}</option>
    {% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>
<p>{{ books|length }} book{{ 's' if books|length != 1 }}</p>
<table>
  <tr><th>Title</th><th>Author</th><th>Status</th></tr>
  {% for b in books %}
  <tr>
    <td><a href="{{ url_for('book', book_id=b.book_id) }}">{{ b.title }}</a></td>
    <td>{{ b.author }}</td>
    <td>{{ b.status }}{% if b.loan_id %} · {{ b.borrower }}, due {{ b.due_on }}{% endif %}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
