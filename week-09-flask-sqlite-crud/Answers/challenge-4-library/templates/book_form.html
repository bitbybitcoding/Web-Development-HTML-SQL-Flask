{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit book' if editing else 'Add a book' }}</h1>
<form method="post" novalidate action="{{ url_for('edit_book', book_id=book_id) if editing else url_for('new_book') }}">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" value="{{ form.title }}">
  {% if errors.title %}<p class="error">{{ errors.title }}</p>{% endif %}
  <label for="author">Author</label>
  <input type="text" id="author" name="author" value="{{ form.author }}">
  {% if errors.author %}<p class="error">{{ errors.author }}</p>{% endif %}
  <button type="submit">Save</button>
</form>
{% endblock %}
