<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}School Records{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Students</a>
    <a href="{{ url_for('create') }}">Add student</a>
    <a href="{{ url_for('ccas') }}">CCAs</a>
    <a href="{{ url_for('report') }}">Subject report</a>
  </nav>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Bit by Bit Coding · Week 9 challenges</footer>
</body>
</html>
