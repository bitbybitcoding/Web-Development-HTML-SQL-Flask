{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1>Categories</h1>
<table>
  <tr><th>Name</th><th>Kits</th><th></th></tr>
  {% for r in rows %}
  <tr><td>{{ r.name }}</td><td>{{ r.kits }}</td>
      <td><form method="post" action="{{ url_for('delete_category', category_id=r.category_id) }}"><button type="submit">Delete</button></form></td></tr>
  {% endfor %}
</table>
<h2>Add a category</h2>
<form method="post" action="{{ url_for('categories') }}">
  <label for="name">Name</label>
  <input type="text" id="name" name="name">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Add</button>
</form>
{% endblock %}
