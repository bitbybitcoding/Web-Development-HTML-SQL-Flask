<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kit Loans{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('new_kit') }}">Add kit</a>
    <a href="{{ url_for('categories') }}">Categories</a>
    <a href="{{ url_for('overdue') }}">Overdue</a>
    <a href="{{ url_for('report') }}">Report</a>
  </nav>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Robotics Club kit loans</footer>
</body>
</html>
