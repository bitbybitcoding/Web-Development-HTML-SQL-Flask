{% extends "base.html" %}
{% block content %}
<h1>Items</h1>
<form method="get" action="{{ url_for('index') }}">
  <label for="q">Search</label>
  <input type="search" id="q" name="q" value="{{ q }}">
  <button type="submit">Search</button>
</form>
{% if items %}
<table>
  <tr><th>Name</th><th>Category</th><th>Quantity</th><th></th></tr>
  {% for i in items %}
  <tr>
    <td>{{ i.name }}</td><td>{{ i.category }}</td><td>{{ i.quantity }}</td>
    <td class="actions">
      <a href="{{ url_for('edit_item', item_id=i.item_id) }}">Edit</a>
      <form method="post" action="{{ url_for('delete_item', item_id=i.item_id) }}"><button class="danger" type="submit">Delete</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>Nothing found.</p>
{% endif %}
{% endblock %}
